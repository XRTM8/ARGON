<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARGON — Browser extension</title><link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><div class="brand"><img src="mark.svg" width="28" height="28" alt=""><div><strong>ARGON</strong><span data-i18n="integration"></span></div></div><button id="language" class="quiet" aria-label="Switch language">EN</button></header>
  <div class="connection"><span id="statusDot" class="dot"></span><div><strong id="statusText" role="status"></strong><span id="statusHelp"></span></div><button id="checkStatus" class="quiet" data-i18n="retry"></button></div>
  <section class="capture-section"><label class="toggle-row"><span><strong data-i18n="capture"></strong><small data-i18n="captureHelp"></small></span><input type="checkbox" id="interceptToggle" role="switch"></label><button id="excludeSite" class="site-button"></button></section>
  <form id="manualForm"><label for="manualUrl" data-i18n="linkLabel"></label><textarea id="manualUrl" dir="ltr" rows="2" spellcheck="false" placeholder="https://example.com/file.zip" required></textarea><div class="manual-actions"><button id="usePage" type="button" class="quiet" data-i18n="usePage"></button><button id="sendBtn" class="primary" type="submit" data-i18n="send"></button></div></form>
  <section class="page-files"><div class="section-heading"><h2 data-i18n="pageFiles"></h2><button id="scanPage" class="quiet" data-i18n="scan"></button></div><div class="tabs"><button id="mediaTab" aria-pressed="true" data-i18n="media"></button><button id="linksTab" aria-pressed="false" data-i18n="links"></button></div><p id="emptyMedia" class="empty"></p><div id="mediaList"></div><div id="selectionActions" class="selection" hidden><label><input type="checkbox" id="selectAll"><span data-i18n="selectAll"></span></label><button id="sendSelected" class="primary"></button></div></section>
  <details><summary data-i18n="preferences"></summary><label class="preference"><span data-i18n="minSize"></span><select id="minSize"><option value="0" data-i18n="anySize"></option><option value="1048576">1 MB</option><option value="10485760">10 MB</option><option value="104857600">100 MB</option></select></label><label for="excludedHosts" data-i18n="excludedHosts"></label><textarea id="excludedHosts" rows="2" dir="ltr" placeholder="example.com"></textarea><button id="saveHosts" class="quiet" data-i18n="save"></button><p class="muted" data-i18n="privacy"></p></details>
  <p id="feedback" role="status" aria-live="polite"></p>
  <footer><span id="version"></span><span data-i18n="local"></span></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
