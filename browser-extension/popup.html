<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=320"><title>ARGON</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div class="brand"><img src="mark.svg" width="24" height="24" alt=""><strong>ARGON</strong></div><button id="language" class="quiet" aria-label="Switch language">EN</button></header>
<div class="connection"><span id="statusDot" class="dot"></span><strong id="statusText" role="status"></strong><button id="checkStatus" class="quiet" title="Check connection" aria-label="Check connection">↻</button></div>
<p id="statusHelp" class="muted" hidden></p>
<section class="page-files"><div class="section-heading"><h1 id="filesHeading"></h1><button id="scanPage" class="quiet" aria-label="Refresh detected files">↻</button></div><p id="emptyMedia" class="empty"></p><div id="mediaList"></div></section>
<p id="feedback" role="status" aria-live="polite"></p>
<details><summary id="optionsLabel"></summary><div class="options">
<label class="toggle-row"><span id="captureLabel"></span><input type="checkbox" id="interceptToggle" role="switch"></label>
<label class="toggle-row"><span id="videoLabel"></span><input type="checkbox" id="videoToggle" role="switch"></label>
<label class="toggle-row"><span id="cookiesLabel"></span><input type="checkbox" id="cookiesToggle" role="switch"></label>
<button id="excludeSite" class="quiet site-button"></button>
<label class="preference"><span id="minSizeLabel"></span><select id="minSize"><option value="0" id="anySize"></option><option value="1048576">1 MB</option><option value="10485760">10 MB</option><option value="104857600">100 MB</option></select></label>
<form id="manualForm"><label for="manualUrl" id="manualLabel"></label><div class="manual-row"><input id="manualUrl" type="url" required dir="ltr" placeholder="https://…" spellcheck="false"><button class="primary" id="sendBtn" type="submit"></button></div></form>
</div></details>
<footer><span id="version"></span><span id="privacyLabel"></span></footer><script type="module" src="popup.js"></script></body></html>
