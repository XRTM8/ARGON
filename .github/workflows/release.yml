name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching package.json, for example v2.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify release and frontend
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Check version and tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          node scripts/check-version.mjs "$tag"
          test -s "docs/releases/$tag.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: npm run build

  windows:
    name: Windows tests and installers
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            flow-core -> target
      - run: npm ci
      - run: npm run prepare:tools
      - run: npm run build
      - name: Test native download and sharing engines
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path flow-core/Cargo.toml -- --test-threads=1
      - name: Build Windows installer
        run: npm run tauri:build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify the installer signature against ARGON's embedded public key
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe -File | Where-Object { $_.Name -like "*$env:VERSION*" })
          if ($installer.Count -ne 1) { throw 'Expected one installer for this version.' }
          $env:ARGON_SIGNED_INSTALLER = $installer[0].FullName
          cargo test --locked --manifest-path src-tauri/Cargo.toml release_signature_matches_embedded_key -- --ignored
      - name: Stage and validate complete release archives
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: ./scripts/stage-windows-release.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  publish:
    name: Verify assets and publish release
    needs: [verify, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: upload
      - name: Generate release feed and checksums
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-latest-json.mjs \
            --tag "$TAG" --out-dir upload \
            --installer "upload/ARGON_${VERSION}_x64-setup.exe" \
            --signature "upload/ARGON_${VERSION}_x64-setup.exe.sig" \
            --portable "upload/argon-${VERSION}-portable.zip" \
            --extension "upload/argon-${VERSION}-browser-extension.zip"
          (cd upload && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          printf '\n\nBuild and automated checks: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "docs/releases/$TAG.md"
      - name: Refuse changes to an already published release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const existing = releases.find(release => release.tag_name === process.env.TAG);
            if (existing && (!existing.draft || existing.target_commitish !== context.sha)) {
              throw new Error('This tag already belongs to a different or published release.');
            }
      - name: Upload all assets to a draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ARGON ${{ env.VERSION }}
          body_path: docs/releases/${{ env.TAG }}.md
          draft: true
          files: upload/*
          fail_on_unmatched_files: true
      - name: Verify uploaded assets before making the release public
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const release = releases.find(item => item.tag_name === process.env.TAG && item.draft);
            if (!release) throw new Error('Draft release missing.');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id: release.id, per_page: 100 });
            const required = [`ARGON_${process.env.VERSION}_x64-setup.exe`, `ARGON_${process.env.VERSION}_x64-setup.exe.sig`, `argon-${process.env.VERSION}-portable.zip`, `argon-${process.env.VERSION}-browser-extension.zip`, 'latest.json', 'SHA256SUMS.txt'];
            for (const name of required) {
              const asset = assets.find(item => item.name === name && item.state === 'uploaded');
              if (!asset || asset.size !== fs.statSync(`upload/${name}`).size) throw new Error(`Uploaded asset is missing or incomplete: ${name}`);
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false, prerelease: false, make_latest: 'true' });
